---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: managedsecrets.secrets.operator.io
spec:
  group: secrets.operator.io
  names:
    kind: ManagedSecret
    listKind: ManagedSecretList
    plural: managedsecrets
    singular: managedsecret
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ManagedSecret describes a desired Kubernetes Secret,
          sourced from a SecretStore.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ManagedSecretSpec describes what to fetch and how to deliver
              it.
            properties:
              deletionPolicy:
                default: Retain
                enum:
                - Retain
                - Delete
                type: string
              refreshInterval:
                description: RefreshInterval controls how often the operator re-checks
                  the backend.
                type: string
              remoteRefs:
                description: RemoteRefs lists the remote values to fetch.
                items:
                  description: RemoteRef points to one value in the backend, and where
                    it should land locally.
                  properties:
                    key:
                      description: Key is the field name to read from the remote secret.
                      type: string
                    localKey:
                      description: |-
                        LocalKey is the key name to use in the generated Kubernetes Secret.
                        If empty, it defaults to Key (or SecretID).
                      type: string
                    path:
                      description: Path is the Vault secret path (used when the SecretStore's
                        providerType is "vault").
                      type: string
                    secretId:
                      description: SecretID is the AWS secret name (used when providerType
                        is "aws-secrets-manager").
                      type: string
                    versionStage:
                      description: VersionStage is the AWS version stage to read,
                        e.g. AWSCURRENT.
                      type: string
                  type: object
                type: array
              storeRef:
                description: StoreRef is the name of a SecretStore in the same namespace.
                type: string
              targetSecretName:
                description: TargetSecretName is the Kubernetes Secret this ManagedSecret
                  will create/update.
